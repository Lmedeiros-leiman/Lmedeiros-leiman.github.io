<svg xmlns="http://www.w3.org/2000/svg" width="720" height="526" viewBox="0 0 720 526" role="img" aria-labelledby="title">
  <title id="title">The layers of my app, from the window down to the office network</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
      .title { font-size: 15px; font-weight: 600; }
      .small { font-size: 14px; font-weight: 600; }
      .sub { font-size: 13px; fill: #424a53; }
      .box { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
      .inner { fill: #f6f8fa; stroke: #afb8c1; stroke-width: 1.2; }
      .common { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
      .net { fill: #eaeef2; stroke: #8c959f; stroke-width: 1.5; }
      .line { stroke: #57606a; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="720" height="526" fill="#f6f8fa"/>

  <rect class="box" x="40" y="20" width="640" height="70" rx="8"/>
  <text class="title" x="360" y="47" text-anchor="middle">The window</text>
  <text class="sub" x="360" y="70" text-anchor="middle">the desktop app; it only ever talks to the common layer</text>
  <line class="line" x1="360" y1="92" x2="360" y2="116" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect class="common" x="40" y="118" width="640" height="90" rx="8"/>
  <text class="title" x="360" y="145" text-anchor="middle">The common layer</text>
  <text class="sub" x="360" y="168" text-anchor="middle">one adapter per network turns both into the same shape:</text>
  <text class="sub" x="360" y="188" text-anchor="middle">contacts, messages, file transfers. Contact IDs start with the network's name.</text>
  <line class="line" x1="190" y1="210" x2="190" y2="234" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="line" x1="530" y1="210" x2="530" y2="234" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect class="box" x="40" y="236" width="300" height="150" rx="8"/>
  <text class="title" x="190" y="262" text-anchor="middle">BeeBEEP engine</text>
  <text class="sub" x="190" y="284" text-anchor="middle">calls out, connects, says hello, locks,</text>
  <text class="sub" x="190" y="304" text-anchor="middle">sends receipts, resends, moves files</text>
  <rect class="inner" x="56" y="318" width="268" height="54" rx="6"/>
  <text class="small" x="190" y="340" text-anchor="middle">BeeBEEP translator</text>
  <text class="sub" x="190" y="361" text-anchor="middle">a message to exact bytes, and back</text>
  <line class="line" x1="190" y1="388" x2="190" y2="434" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect class="box" x="380" y="236" width="300" height="150" rx="8"/>
  <text class="title" x="530" y="262" text-anchor="middle">LAN Messenger engine</text>
  <text class="sub" x="530" y="284" text-anchor="middle">calls out, connects, says hello, locks,</text>
  <text class="sub" x="530" y="304" text-anchor="middle">sends receipts, resends, moves files</text>
  <rect class="inner" x="396" y="318" width="268" height="54" rx="6"/>
  <text class="small" x="530" y="340" text-anchor="middle">LAN Messenger translator</text>
  <text class="sub" x="530" y="361" text-anchor="middle">a message to exact bytes, and back</text>
  <line class="line" x1="530" y1="388" x2="530" y2="434" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect class="net" x="40" y="436" width="640" height="70" rx="8"/>
  <text class="title" x="360" y="463" text-anchor="middle">The office network</text>
  <text class="sub" x="360" y="486" text-anchor="middle">the original BeeBEEP and LAN Messenger on other computers</text>
</svg>
